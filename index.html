<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eya3D - Professional browser 3D modeling SaaS with mesh editing, sculpting, and studio rendering." />
    <title>Eya3D | Web 3D Modeling & Studio Render</title>
    <script>
      // Single Page Application redirect handler for GitHub Pages
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();

      // Catch global network/script errors on asset loading
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('ResizeObserver') !== -1 || e.message.indexOf('websocket') !== -1)) return;
        var loader = document.getElementById('app-loader-container');
        if (loader) {
          var details = e.message || (e.target && (e.target.src || e.target.href)) || 'Erreur de chargement';
          loader.innerHTML = '<div style="max-width:440px;padding:24px;background:#161920;border:1px solid #ef4444;border-radius:12px;color:#f87171;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);margin:16px;">' +
            '<h3 style="margin:0 0 8px;font-size:15px;font-weight:700;color:#fff;">Erreur de chargement des ressources</h3>' +
            '<p style="font-size:12px;color:#94a3b8;margin:0 0 14px;line-height:1.5;">Le navigateur n\\\'a pas pu récupérer les composants graphiques du studio.</p>' +
            '<div style="background:#090a0c;padding:10px;border-radius:6px;font-size:11px;color:#fca5a5;text-align:left;overflow:auto;max-height:80px;margin-bottom:16px;word-break:break-all;font-family:monospace;">' + details + '</div>' +
            '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Réessayer</button>' +
            '</div>';
        }
      }, true);

      // Timeout fallback: if after 10s React hasn't replaced the loader, show diagnostic
      setTimeout(function () {
        var timeoutNotice = document.getElementById('app-loader-timeout');
        if (timeoutNotice) {
          timeoutNotice.style.display = 'block';
        }
      }, 10000);
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090A0C;
        z-index: 9999;
      }
      .app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-loader-text {
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader-container" class="app-loader">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">Initialisation Eya3D...</div>
        <div id="app-loader-timeout" style="display:none;margin-top:20px;text-align:center;max-width:320px;padding:0 16px;">
          <p style="font-size:12px;color:#94a3b8;margin-bottom:12px;line-height:1.4;">Le chargement prend plus de temps que prévu.</p>
          <button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Rafraîchir la page</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
