[package]
name = "eya3d-rust-renderer"
version = "0.1.0"
edition = "2021"
description = "WebGPU/WASM 3D PBR rendering core for Eya3D Studio"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.19", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = "0.29"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "23.0", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
